# Codemagic cloud build for Harborline (Android / Google Play).
# Each build makes a signed .aab you upload to Google Play.
# Setup steps: see "GOOGLE PLAY GUIDE.md".
workflows:
  android-release:
    name: Harborline - Android release
    instance_type: mac_mini_m2          # covered by Codemagic's 500 free minutes a month
    max_build_duration: 40
    environment:
      android_signing:
        - harborline_upload             # the name you give the keystore in Codemagic
      node: 22
      java: 21
    scripts:
      - name: Install packages
        script: npm install
      - name: Create the Android project
        script: |
          npx cap add android
          node scripts/landscape.mjs
      - name: App icon and splash screen
        script: npm run icons:android
      - name: Copy the game into the app
        script: npx cap sync android
      - name: Release settings (API 36, version, signing)
        script: node scripts/android-release.mjs
      - name: Build the app bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
